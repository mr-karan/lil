# Server configuration
[server]
# The address and port the server will listen on (e.g. ":7000" for all interfaces, port 7000)
address = ":7000"
# Maximum duration for reading the entire request, including body
read_timeout = "7s"
# Maximum duration before timing out writes of the response
write_timeout = "7s"
# Maximum amount of time to wait for the next request when keep-alives are enabled
idle_timeout = "60s"

# Database configuration
[db]
# Path to SQLite database file
path = "urls.db"
# SQLite uses one persistent connection and commits writes synchronously.

# Application configuration
[app]
# Enable detailed debug logging
enable_debug_logs = true
# Length of generated short URL codes
short_url_length = 6
# Base URL used for generating shortened links
public_url = "https://lil.io"

# Authentication
[auth]
# "oidc" for real deployments. "dev" signs every request in as dev_email: local testing only.
mode = "oidc"
# How long a browser session lasts.
session_lifetime = "168h"
# Used only when mode = "dev".
dev_email = "dev@example.com"

[auth.oidc]
issuer_url = "https://accounts.google.com"
client_id = "your-client-id"
# Leave empty for a PKCE-only public client.
client_secret = "your-client-secret"
# Must match the redirect URI registered with the IdP.
redirect_url = "https://lil.example.com/auth/oidc"
# Required. Every person allowed to sign in, by full email. There is no self
# sign-up: only this list grants access.
allowed_emails = ["you@example.com"]
# Optional extra check. When set, a listed email must also be in one of these
# domains (on Google, the signed hd claim at sign-in). Leave empty to skip.
allowed_domains = []

# Analytics configuration
[analytics]
# Enable/disable analytics collection
enabled = true
# Number of concurrent workers processing analytics events
num_workers = 2

# Plausible Analytics integration
[analytics.providers.plausible]
# Enable this provider
enabled = true
# Plausible API endpoint for sending events
endpoint = "http://plausible:8000/api/event"
# Request timeout in seconds
timeout = 5

# Access log configuration
[analytics.providers.accesslog]
# Enable/disable access log writing
enabled = true
# Optional path for JSON Lines access logs
file_path = "access.log"

# Webhook integration
[analytics.providers.webhook]
# Enable this provider
enabled = true
# Webhook endpoint URL
endpoint = "https://api.example.com/webhook"
# Request timeout in seconds
timeout = 5
# Custom headers to include in webhook requests
headers = { "Authorization" = "Bearer your-token", "X-Custom-Header" = "custom-value" }
